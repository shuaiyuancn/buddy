name: Build & Release Buddy

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish release asset if tag or dispatch'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Buddy Standalone Executable (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          python -m pytest -v

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller Buddy.spec --noconfirm

      - name: Verify executable output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Buddy.exe")) {
            Write-Error "dist/Buddy.exe was not created!"
            exit 1
          }
          $item = Get-Item "dist/Buddy.exe"
          Write-Host "Buddy.exe built successfully. Size: $([math]::round($item.Length / 1MB, 2)) MB"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Buddy-Windows-x64
          path: dist/Buddy.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Buddy.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
